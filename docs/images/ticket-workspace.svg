<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Ticket detail workspace</title><desc id="desc">Customer message, sample AI analysis and editable draft, internal comments, and ticket properties.</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172033;font-size:18px}.muted{fill:#58677e;font-size:16px}.heading{font-size:28px;font-weight:700}.number{font-size:40px;font-weight:700}.card{fill:white;stroke:#dce4ef}.white{fill:white}</style><rect width="1200" height="780" rx="16" fill="#f4f7fb"/><text x="32" y="37" class="muted">TICKETS / TICKET DETAIL</text><text x="32" y="77" class="heading">Charged twice for annual plan</text><text x="32" y="108" class="muted">Open · ticket ID · created date and time</text><rect x="936" y="46" width="228" height="48" rx="10" fill="#6354c7" stroke="#dce4ef"/><text x="956" y="77" class="white">Analyze with AI</text><circle cx="1170" cy="40" r="15" fill="#2867d9"/><text x="1170" y="46" text-anchor="middle" style="fill:white;font-size:16px;font-weight:700">2</text><rect x="32" y="139" width="772" height="119" rx="10" fill="white" stroke="#dce4ef"/><text x="55" y="171" class="muted">CUSTOMER MESSAGE</text><text x="55" y="204" class="">Our card shows two identical renewals from yesterday.</text><text x="55" y="232" class="">Please reverse the duplicate charge.</text><circle cx="33" cy="132" r="15" fill="#2867d9"/><text x="33" y="138" text-anchor="middle" style="fill:white;font-size:16px;font-weight:700">1</text><rect x="32" y="278" width="772" height="250" rx="10" fill="#f6f8ff" stroke="#dce4ef"/><text x="55" y="310" class="muted">AI COPILOT</text><text x="55" y="340" class="">Suggested response</text><rect x="477" y="296" width="87" height="32" rx="10" fill="#e5ebf5" stroke="#dce4ef"/><text x="495" y="318" class="muted">Billing</text><rect x="576" y="296" width="201" height="32" rx="10" fill="#ffede6" stroke="#dce4ef"/><text x="591" y="318" class="muted">Negative sentiment</text><rect x="55" y="356" width="725" height="98" rx="10" fill="white" stroke="#dce4ef"/><text x="71" y="384" class="">I’m sorry about the duplicate renewal charge.</text><text x="71" y="413" class="">Please share the invoice reference so we can investigate.</text><text x="71" y="440" class="muted">Illustrative draft — actual AI output will vary.</text><text x="55" y="493" class="muted">Review and edit before saving.</text><rect x="639" y="471" width="140" height="36" rx="10" fill="#2867d9" stroke="#dce4ef"/><text x="660" y="495" class="white">Save draft</text><circle cx="33" cy="279" r="15" fill="#2867d9"/><text x="33" y="285" text-anchor="middle" style="fill:white;font-size:16px;font-weight:700">3</text><rect x="32" y="548" width="772" height="181" rx="10" fill="white" stroke="#dce4ef"/><text x="55" y="581" class="">Internal comments</text><text x="55" y="611" class="muted">Author + timestamp + comment body</text><rect x="55" y="630" width="526" height="72" rx="10" fill="white" stroke="#dce4ef"/><text x="72" y="658" class="muted">Add an internal comment...</text><rect x="599" y="655" width="180" height="44" rx="10" fill="#2867d9" stroke="#dce4ef"/><text x="621" y="683" class="white">Add comment</text><circle cx="33" cy="546" r="15" fill="#2867d9"/><text x="33" y="552" text-anchor="middle" style="fill:white;font-size:16px;font-weight:700">4</text><rect x="826" y="139" width="338" height="590" rx="10" fill="white" stroke="#dce4ef"/><text x="849" y="174" class="">Ticket properties</text><circle cx="1170" cy="132" r="15" fill="#2867d9"/><text x="1170" y="138" text-anchor="middle" style="fill:white;font-size:16px;font-weight:700">5</text><text x="849" y="214" class="muted">Status</text><rect x="849" y="226" width="292" height="48" rx="10" fill="white" stroke="#dce4ef"/><text x="865" y="257" class="">Open</text><text x="849" y="307" class="muted">Priority</text><rect x="849" y="319" width="292" height="48" rx="10" fill="white" stroke="#dce4ef"/><text x="865" y="350" class="">High</text><text x="849" y="400" class="muted">Category</text><rect x="849" y="412" width="292" height="48" rx="10" fill="white" stroke="#dce4ef"/><text x="865" y="443" class="">Billing</text><text x="849" y="493" class="muted">Assigned to · Admin can change</text><rect x="849" y="505" width="292" height="48" rx="10" fill="white" stroke="#dce4ef"/><text x="865" y="536" class="">Daniel Reed</text><text x="849" y="617" class="muted">Last updated</text><text x="849" y="648" class="">Date and time</text><text x="32" y="758" class="muted">Illustrated feature map · sample analysis and comment layout · not a browser screenshot</text></svg>
